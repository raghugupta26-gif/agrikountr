    case 'infoStock': { const r=S.info.r; S.inbox={img:S.info.img, items:[{...blankItem(), name:r.name||'', company:r.company||'', category:CATS[r.type]?r.type:'other', gst:S.shop.gst[CATS[r.type]?r.type:'other']}]}; go('in'); break; }
    case 'dxCrop': readDxForm(); S.dxCrop=b.dataset.c; render(); break;
    case 'dxMic': micToggle(b, t=>{ S.dxNote=t; const el=$('#dxNote'); if(el) el.value=t; }); break;
    case 'dxPhoto': readDxForm(); takePhoto(blob=>diagnose(blob)); break;
    case 'dxGallery': readDxForm(); takePhoto(blob=>diagnose(blob), true); break;
    case 'dxSay': if(S.dx&&S.dx.dx) say(S.dx.dx.summary_te||''); break;
    case 'dxSave': saveCase(); break;
    case 'dxToBill': dxToBill(); break;
    case 'dxNew': S.dx=null; render(); break;
    case 'openCase': { const c=S.cases.find(x=>x.id===b.dataset.id); if(c){ S.dx={...c, saved:true}; window.scrollTo(0,0); render(); } break; }
    case 'dxOutcome': { const d=S.dx; const c=S.cases.find(x=>x.id===d.id); if(c){ put('cases',{...c, outcome:b.dataset.o}); d.outcome=b.dataset.o; } toast('గుర్తు పెట్టాం · Noted'); break; }
    case 'openLesson': S.lesson=b.dataset.id; window.scrollTo(0,0); render(); break;
    case 'lessonSay': { const l=LESSONS.find(x=>x.id===S.lesson); if(l) say(l.te+'. '+l.pts.map(p=>p[0]).join(' ')); break; }
    case 'ptSay': { const l=LESSONS.find(x=>x.id===S.lesson); if(l) say(l.pts[+b.dataset.i][0]); break; }
    case 'lessonDone': S.shop.learned={...(S.shop.learned||{}), [S.lesson]:true}; saveShop(); S.lesson=null; render(); toast('బాగుంది! · Well done'); break;
    case 'demo': loadDemo(); break;
    case 'sellPhoto': takePhoto(blob=>sellFromPhoto(blob)); break;
    case 'sellMic': micToggle(b, t=>sellFromText(t)); break;
    case 'nameMic': micToggle(b, t=>{ cart().farmer=t; const el=$('#fName'); if(el) el.value=t; }); break;
    case 'add': addToCart(b.dataset.id,1); render(); break;
    case 'inc': c.items[+b.dataset.i].qty++; render(); break;
    case 'dec': { const it=c.items[+b.dataset.i]; it.qty--; if(it.qty<=0) c.items.splice(+b.dataset.i,1); render(); break; }
    case 'from': c.items[+b.dataset.i].from=b.dataset.l; render(); break;
    case 'pickParty': { const p=S.parties.find(x=>x.id===b.dataset.id); if(p){ Object.assign(cart(),{farmer:p.name,village:p.village||'',phone:p.phone||''}); render(); } break; }
    case 'pay': finishSale(b.dataset.m); break;
    case 'inPlace': if(S.inbox) readInForm(); S.inPlace=b.dataset.l; render(); break;
    case 'inPhoto': case 'scanCam': takePhoto(blob=>scanBill(blob, a==='inPhoto', 'purchase')); break;
    case 'inGallery': case 'scanGal': S.manyKind='purchase'; takeMany(); break;
    case 'scanSale': takePhoto(blob=>scanBill(blob, S.view==='sell', 'sale')); break;
    case 'scanSaleMany': S.manyKind='sale'; takeMany(); break;
    case 'addPage': { const id=b.dataset.id; takePhoto(blob=>addPage(id, blob)); break; }
    case 'openScan': openScan(b.dataset.id); break;
    case 'rereadScan': { const sc=S.scans.find(x=>x.id===b.dataset.id); if(sc){ put('scans',{...sc,status:'reading'}); slot(()=>readScan(sc,null,false)); render(); } break; }
    case 'dropScan': { if(b.dataset.sure){ del('scans',b.dataset.id).then(render); } else { b.dataset.sure=1; b.textContent='మళ్లీ నొక్కండి · Tap again'; } break; }
    case 'zoomImg': sheet(`<img src="${b.getAttribute('src')}" style="width:100%;border-radius:12px" alt="Bill"><button class="act ghost" id="zc">మూసివేయండి · Close</button>`); $('#zc').onclick=closeSheet; break;
    case 'inManual': S.inbox={img:null,items:[blankItem()]}; render(); break;
    case 'inAddRow': readInForm(); S.inbox.items.push(blankItem()); render(); break;
    case 'inRemove': readInForm(); S.inbox.items.splice(+b.dataset.i,1); if(!S.inbox.items.length) S.inbox=null; render(); break;
    case 'inSave': saveInbox(); break;
    case 'inCancel': S.inbox=null; render(); break;
    case 'inHere': S.inPlace=S.place; go('in'); break;
    case 'openPlace': S.place=b.dataset.l; S.filter='all'; window.scrollTo(0,0); render(); break;
    case 'moveStock': moveSheet(null); break;
    case 'sayPlace': say(placeSpeech(S.place)); break;
    case 'askMic': micToggle(b, t=>{ const el=$('#askQ'); if(el) el.value=t; askStock(t); }); break;
    case 'askGo': askStock(($('#askQ')||{}).value?.trim()); break;
    case 'sayAns': if(S.answer) say(S.answer.te); break;
    case 'licPhoto': takePhoto((blob,url)=>licFromPhoto(blob,url)); break;
    case 'licAdd': licSheet(null); break;
    case 'licEdit': licSheet(S.licences.find(l=>l.id===b.dataset.id)); break;
    case 'khata': takePhoto(blob=>khataFromPhoto(blob)); break;
    case 'recv': receiptSheet(b.dataset.id); break;
    case 'filter': S.filter=b.dataset.f; render(); break;
    case 'editProd': editProd(b.dataset.id); break;
    case 'openBill': S.billId=b.dataset.id; go('bill'); break;
    case 'copyBill': { const s=S.sales.find(x=>x.id===S.billId); navigator.clipboard.writeText(billText(s)).then(()=>toast('Bill copied. Paste in WhatsApp or SMS.')).catch(()=>toast('Copy not allowed here.')); break; }
    case 'addLoc': readSettings(); { const n=locs().length; S.shop.locs=[...locs(), {id:'w'+Date.now().toString(36), name:`గోదాము ${n} · Godown ${n}`}]; } render(); break;
    case 'saveSet': readSettings(); saveShop().then(()=>{ toast('సేవ్ అయింది · Saved'); go('home'); }); break;
  }
}
$('#backBtn').innerHTML=I.back; $('#sayBtn').innerHTML=I.speaker;
$('#backBtn').onclick=()=>{ if(S.view==='info'){ go('home'); return; } if(S.view==='ledger'){ go('outst'); return; } if(['day','cashbook','outst','pl','stocksum','position'].includes(S.view)){ go('acc'); return; } if(S.view==='doctor'&&S.dx){ S.dx=null; render(); } else if(S.view==='learn'&&S.lesson){ S.lesson=null; render(); } else if(S.view==='bill') go('bills'); else if(S.view==='places'&&S.place){ S.place=null; S.filter='all'; render(); } else { S.q=''; S.filter='all'; go('home'); } };
$('#sayBtn').onclick=()=>say(HELP[S.view]||HELP.home);

loadLocal(); render(); connect();

</script>
</body>
</html>
