<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishi Khata</title>
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#1d5c3a">
<style>
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/anek-telugu-telugu-400-normal.woff2) format('woff2');unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC}
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/anek-telugu-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+20B9,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fonts/anek-telugu-telugu-600-normal.woff2) format('woff2');unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC}
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fonts/anek-telugu-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+20B9,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:800;font-display:swap;src:url(vendor/fonts/anek-telugu-telugu-800-normal.woff2) format('woff2');unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC}
@font-face{font-family:'Anek Telugu';font-style:normal;font-weight:800;font-display:swap;src:url(vendor/fonts/anek-telugu-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+20B9,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* Layout: one-column phone app, huge picture buttons, Telugu first with English below */
  --field:#1d5c3a;      /* deep crop green: primary / sell */
  --turmeric:#e3a21a;   /* stock-in */
  --soil:#7a4524;       /* udhaar / credit */
  --sky:#1f6f8b;        /* stock */
  --bg:#edf2ec;
  --card:#ffffff;
  --ink:#14251a;
  --muted:#5b6b60;
  --line:#d3ddd3;
  --bad:#c0392b;
  --warn:#d97a14;
  --good:#2e8b57;
  --font:"Anek Telugu","Noto Sans Telugu","Nirmala UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--field);color:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top h1{font-size:22px;margin:0;font-weight:800;flex:1;text-wrap:balance}
header.top small{display:block;font-weight:400;font-size:13px;opacity:.85}
.iconbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;flex:none}
.iconbtn svg{width:26px;height:26px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.tile .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--muted)}
.tile.alert .n{color:var(--bad)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border-radius:22px;padding:18px 10px 14px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.bigbtn svg{width:58px;height:58px}
.bigbtn b{font-size:24px;font-weight:800}
.bigbtn span{font-size:14px;opacity:.9}
.b-sell{background:var(--field)}.b-in{background:var(--turmeric);color:#2b1d00}.b-due{background:var(--soil)}.b-stock{background:var(--sky)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.smallbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.smallbtn svg{width:30px;height:30px;color:var(--field)}
.smallbtn span{display:block;font-size:13px;color:var(--muted);font-weight:400}
.banner{background:#fff7e0;border:1px solid #f0d58a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0}
.act{border-radius:16px;padding:14px 16px;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%}
.act svg{width:30px;height:30px}
.act small{font-weight:400;font-size:14px;opacity:.9}
.act.green{background:var(--field);color:#fff}
.act.yellow{background:var(--turmeric);color:#2b1d00}
.act.brown{background:var(--soil);color:#fff}
.act.blue{background:var(--sky);color:#fff}
.act.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.act.red{background:var(--bad);color:#fff}
.act[disabled]{opacity:.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:19px}
.sect{font-weight:800;font-size:15px;color:var(--muted);margin:4px 2px -6px;text-transform:uppercase;letter-spacing:.03em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:16px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,var(--field));border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px}
.prod .nm{font-weight:800;font-size:17px;line-height:1.2}
.prod .pk{font-size:13px;color:var(--muted)}
.prod .q{font-size:15px;font-weight:600;margin-top:auto;font-variant-numeric:tabular-nums}
.prod .ic{width:26px;height:26px;color:var(--c)}
.cat-fertilizer{--c:var(--field)}.cat-pesticide{--c:var(--bad)}.cat-seed{--c:var(--turmeric)}.cat-other{--c:var(--sky)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--blue,#1f5fa8);text-decoration:underline dotted;cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:#e7ece7;color:var(--ink)}
.pill.bad{background:#fbe1dd;color:var(--bad)}.pill.warn{background:#fdebd3;color:#8a4a00}.pill.good{background:#dcefe3;color:var(--good)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.line:first-child{border-top:0}
.line .grow{flex:1;min-width:0}
.line .nm{font-weight:800}
.line .sub{font-size:14px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;background:#e7ece7;font-size:26px;font-weight:800;line-height:1}
.qty input{width:56px;text-align:center;font-weight:800;font-size:20px;border:2px solid var(--line);border-radius:10px;padding:6px 2px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:800;padding-top:8px;border-top:2px solid var(--ink)}
.total .amt{font-size:32px;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);font-weight:600}
label.f input,label.f select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:19px;color:var(--ink);background:#fff;font-weight:600;width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .w{grid-column:1/-1}
.withmic{display:flex;gap:8px;align-items:flex-end}
.withmic label{flex:1}
.mic{width:56px;height:56px;border-radius:14px;background:var(--field);color:#fff;display:grid;place-items:center;flex:none}
.mic svg{width:28px;height:28px}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,57,43,.25)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.party{display:flex;gap:12px;align-items:center}
.party .av{width:52px;height:52px;border-radius:50%;background:var(--soil);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.party .due{font-size:24px;font-weight:800;color:var(--soil);font-variant-numeric:tabular-nums;text-align:right}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .act{flex:1;min-width:130px;font-size:17px;min-height:52px;padding:10px}
.bill{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;font-size:15px;font-variant-numeric:tabular-nums}
.bill h2{margin:0;text-align:center;font-size:22px}
.bill .c{text-align:center;color:var(--muted);font-size:13px}
.bill table{width:100%;border-collapse:collapse;margin-top:10px}
.bill th,.bill td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.bill td.r,.bill th.r{text-align:right}
.bill .tt{font-size:20px;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:20px 10px}
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:22px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:28px;font-weight:800;padding:12px 0}
.padshow{font-size:40px;font-weight:800;text-align:center;background:#fff;border-radius:14px;padding:8px;font-variant-numeric:tabular-nums}
.busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px;text-align:center}
.spin{width:64px;height:64px;border-radius:50%;border:7px solid #cfdccf;border-top-color:var(--field);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:30;font-weight:600;max-width:90%;text-align:center}
.note{font-size:14px;color:var(--muted)}
.hide{display:none!important}
.speak{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
.speak svg{width:26px;height:26px;color:var(--field);flex:none}
.big.six .bigbtn{min-height:128px}
.b-gd{background:#4a5a2a}.b-lic{background:#3d3d6b}.b-doc{background:#0f766e}.b-learn{background:#9a3412}
.alertbar{background:#fbe1dd;border:1px solid #f1b3a9;color:#7a1d12;border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.alertbar.warn{background:#fdebd3;border-color:#f3c98f;color:#6b3a00}
.locs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.loc{border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:600;background:#fff}
.loc.on{background:var(--sky);border-color:var(--sky);color:#fff}
.card.place{flex-direction:row}
.place{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.place .pi{width:56px;height:56px;border-radius:16px;background:#4a5a2a;color:#fff;display:grid;place-items:center;flex:none}
.place .pi svg{width:30px;height:30px}
.answer{background:#eef6f0;border:2px solid var(--field);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.answer p{margin:0}
table.gt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:420px}
table.gt th,table.gt td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}
table.gt td.r{text-align:right}
.linkchip{font-size:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#c9d3cb;display:inline-block}.dot.on{background:#7CFC9A;box-shadow:0 0 0 3px rgba(124,252,154,.25)}
.ibwrap{display:flex;flex-direction:column;gap:16px}.ibform{display:flex;flex-direction:column;gap:16px;min-width:0}
.ibimg{display:flex;flex-direction:column;gap:4px;align-items:center}.ibimg img{max-width:100%;max-height:260px;border-radius:12px;background:#fff;cursor:zoom-in}
@media (min-width:1000px){
  #app{max-width:1180px}
  main{padding:20px 28px}
  .big{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .ibwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  .ibimg{position:sticky;top:90px}.ibimg img{max-height:calc(100vh - 140px)}
  .sheet{max-width:640px;border-radius:22px;margin-bottom:5vh}
  .overlay{align-items:center}
}
input[type=file]{display:none}
.thumb{max-width:100%;max-height:180px;border-radius:12px;object-fit:contain;background:#fff;align-self:center}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="iconbtn hide" id="backBtn" aria-label="Back / వెనక్కి"></button>
    <h1 id="title">Krishi Khata<small>కృషి ఖాతా</small></h1>
    <button id="linkChip" class="linkchip" aria-live="polite" onclick="window.KK&&KK.open()" style="border:0;color:#fff;cursor:pointer"></button>
    <button class="iconbtn" id="sayBtn" aria-label="Read help aloud"></button>
  </header>
  <main id="main"></main>
</div>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="gal" accept="image/*">
<input type="file" id="galm" accept="image/*" multiple>
<div id="layer"></div>

<script src="platform.js"></script>
<script>
/* ---------- icons ---------- */
const I = {

  badge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.6-2 2-3 3.5-3s2.9 1 3.5 3M14 9h4M14 13h4"/></svg>',

  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  sack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-2 4h-4z"/><path d="M10 7C5 10 4 15 5 19a3 3 0 003 2h8a3 3 0 003-2c1-4 0-9-5-12"/></svg>',
  bottle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v4l2 3v12H8V9l2-3z"/><path d="M8 13h8"/></svg>',
  seed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 13c-4 0-7-3-7-7 4 0 7 3 7 7zM12 11c0-4 3-7 7-7 0 4-3 7-7 7z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.700-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 000-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4 5.2 5.2 0 003.2.7 2.7 2.7 0 001.8-1.3 2.2 2.2 0 00.2-1.3c-.1-.1-.3-.2-.6-.3z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',

function fixProd(p){
  const loc = {...(p.loc||{})};
  if(!p.loc) loc.counter = num(p.qty);
  for(const k in loc){ loc[k]=Math.max(0,num(loc[k])); }
  return {...p, loc, qty:Object.values(loc).reduce((a,b)=>a+b,0)};
}

async function put(kind, obj){

  const arr = S[kind]; const i = arr.findIndex(x=>x.id===obj.id);

  if(mode==='cloud'){

    catch(e){ toast(e && e.code==='quota_exceeded' ? 'Storage full. Delete old bills.' : e && e.code==='invalid_argument' ? 'You can only view this shop. Ask the owner for edit access.' : 'Could not save. Check internet.'); }
  } else saveLocal();
}
async function del(kind, id){

async function connect(){
  if(!(window.claude && claude.use)) { S.dataNote='Data is kept on this phone only.'; render(); return; }
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    USER=user; ME = user ? await user.id() : null;
    try{ ISOWNER = user && user.isOwner ? !!(await Promise.resolve(user.isOwner())) : true; }catch(e){ ISOWNER=true; }
    if(db){
      DB=db; ROOT=db.doc('shops/main'); mode='cloud';
      let fresh=false; const timer=setTimeout(()=>{ if(!fresh){ S.dataNote='Data can\'t be reached yet. Check internet.'; renderSoft(); } },10000);
      ROOT.onSnapshot(s=>{ if(s.exists){ Object.assign(S.shop, s.data()); } if(!s.metadata.fromCache){fresh=true;clearTimeout(timer);S.dataNote='';} renderSoft(); }, ()=>{});
      for(const k of KINDS){
        ROOT.collection(k).onSnapshot(q=>{ S[k]=q.docs.map(d=>{ const o={...d.data(), id:d.id}; return k==='products'?fixProd(o):o; }); if(k==='scans') onScansChanged(); renderSoft(); }, ()=>{});
      }
    } else { S.dataNote=''; }
  }catch(e){ S.dataNote='Data is kept on this phone only.'; }
  try{ AI = await claude.use('sample'); }catch(e){ AI=null; }
  try{ DICT = await claude.use('dictation'); }catch(e){ DICT=null; }
  try{ TTS = await claude.use('tts'); }catch(e){ TTS=null; }
  connectRoom();
  render();
  refreshEwbLink().then(()=>{ if(['bill','settings','gst'].includes(S.view)) render(); });
}

function parseJSON(t){ t=String(t||''); const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw new Error('bad'); return JSON.parse(t.slice(a,b+1)); }
async function ask(prompt, images){
  if(!AI) throw {code:'none'};
  const opts = {modelTier:'default', cache:false};
  if(images){
    let ok=true; try{ if(AI.limits){ const l=await AI.limits(); ok=!!(l&&l.images); } }catch(e){}
    if(!ok) throw {code:'noimg'};
    opts.images=images;
  }
  try{
    let v = await AI.json(prompt, opts);
    if(v && typeof v==='object' && typeof v.text==='string' && Object.keys(v).length<=2) v=parseJSON(v.text);
    return v;
  }catch(e){
    if(e && (e.code==='not_granted'||e.code==='rate_limited')) throw e;
    const r = await AI(prompt, opts); return parseJSON(r.text);
  }
}
function aiError(e){
  const c = e && e.code;
  if(c==='none'||c==='not_granted') return 'Photo and voice reading is off here. Add items by tapping instead.';
  if(c==='noimg') return 'Photo reading is not available here. Add items by tapping.';
  if(c==='rate_limited') return 'Too many requests at once. Wait a minute and try again.';
  if(c==='offline'||c==='unauthorized') return 'ఇంటర్నెట్ లేదు · No internet or shop computer not reachable. The photo is saved and will be read automatically later.';
  return 'Could not read that. Try a clearer photo with good light.';
}
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1800/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
}

let listening=null, micBuf='', micHooked=false;
function micToggle(btn, onText){
  if(!DICT){ toast('Mic is not available on this device. Please type.'); return; }
  if(!micHooked){
    micHooked=true;
    DICT.onFinal(({text})=>{ micBuf += (micBuf?' ':'') + text; });
    DICT.onState(({state})=>{ if(state==='idle' && listening){ const L=listening; listening=null; L.btn.classList.remove('on'); L.done(); } });
  }
  if(listening){ const L=listening; listening=null; btn.classList.remove('on'); DICT.stop().then(()=>L.done()).catch(()=>L.done()); return; }
  micBuf='';
  listening={btn, done:()=>{ const t=micBuf.trim(); micBuf=''; if(t) onText(t); }};
  btn.classList.add('on');
  DICT.start().catch(e=>{ listening=null; btn.classList.remove('on'); toast(e&&e.code==='not_granted'?'Mic not allowed. Please type.':'Mic did not start. Try again.'); });
}

function monthState(exp){
  if(!exp) return null;
  const [y,m] = String(exp).split('-').map(Number); if(!y||!m) return null;
  const end = new Date(y, m, 0); const days = (end - new Date())/864e5;
  return days;
}
function expiryState(p){
  const days=monthState(p.exp); if(days===null) return null;
  if(days<0) return {cls:'bad', t:'Expired · గడువు అయింది'};
  if(days<60) return {cls:'warn', t:'Expires '+p.exp};
  return {cls:'', t:'Exp '+p.exp};
}
function licState(l){
  if(!l.valid_to) return {cls:'', t:'No end date', days:null};
  const days=(new Date(l.valid_to+'T23:59:59') - new Date())/864e5;
  if(days<0) return {cls:'bad', t:'Expired · గడువు అయింది '+l.valid_to, days};
  if(days<60) return {cls:'warn', t:`${Math.ceil(days)} రోజుల్లో గడువు · Expires ${l.valid_to}`, days};
  return {cls:'good', t:'Valid till '+l.valid_to, days};
}
const licFor = cat => S.licences.filter(l=>l.type===cat && !l.principal);
function licProblems(){
  const out=[];
  for(const c of ['fertilizer','pesticide','seed']){
    const ls=licFor(c); const sells=S.products.some(p=>p.cat===c&&p.qty>0);
    if(!ls.length){ if(sells) out.push({cls:'warn', t:`${short(LICTYPES[c])} not added · ${c} licence missing`}); continue; }
    const best=ls.map(licState).sort((a,b)=>(b.days??1e9)-(a.days??1e9))[0];
    if(best.cls==='bad') out.push({cls:'bad', t:`${short(LICTYPES[c])} expired · ${c} licence expired`});
    else if(best.cls==='warn') out.push({cls:'warn', t:`${short(LICTYPES[c])}: ${best.t}`});
  }
  return out;
}
/* is this product's company covered by the shop's licence / principal certificates for its category? */
function companyCovered(cat, company){
  if(!company) return true;
  const ls=S.licences.filter(l=>l.type===cat); const all=ls.flatMap(l=>l.companies||[]);
  if(!all.length) return true; // no company list recorded yet: nothing to check
  const c=norm(company); return all.some(x=>{ const n=norm(x); return n && (n.includes(c)||c.includes(n)); });
}

  try{ const r=await ask(P_SALE_PHOTO(), [blob]); applySaleItems(r.items||[]); closeSheet(); render(); }
  catch(e){ closeSheet(); toast(aiError(e)); }
}
async function sellFromText(t){
  busy('వింటోంది… Understanding');
  try{
    const r=await ask(P_SALE_TEXT(t)); const c=cart();
    applySaleItems(r.items||[]);
    if(r.farmer) c.farmer=r.farmer; if(r.village) c.village=r.village; if(r.phone) c.phone=r.phone;
    const kp=S.parties.find(p=>norm(p.name)===norm(c.farmer)); if(kp){ c.village=c.village||kp.village||''; c.phone=c.phone||kp.phone||''; }
    closeSheet(); render();
    if(r.payment==='cash'||r.payment==='credit'){ toast((r.payment==='cash'?'Cash':'Udhaar')+' — tap the button to confirm.'); }
  }catch(e){ closeSheet(); toast(aiError(e)); }
}
function applySaleItems(items){
  let miss=[];
  for(const it of items){
    const q=Math.max(1,Math.round(num(it.qty)||1));
    let p = it.id && S.products.find(x=>x.id===it.id && x.qty>0);
    if(p){ const b=bestBatch(p.name); if(b) p=b; } else p=bestBatch(it.name);
    if(p) addToCart(p.id,q,it.from&&locs().some(l=>l.id===it.from)?it.from:null); else miss.push(it.name);
  }
  if(miss.length) toast('Not in stock: '+miss.join(', '));
}

async function finishSale(m){
  const c=cart(); if(!c.items.length) return;
  c.farmer=($('#fName')||{}).value?.trim()||c.farmer; c.village=($('#fVil')||{}).value?.trim()||c.village; c.phone=($('#fPh')||{}).value?.trim()||c.phone;
  syncCartInputs();
  if(c.b2b && regType()==='regular'){ if(!gstinValid(c.gstin)){ toast('సరైన GSTIN రాయండి · Enter a valid buyer GSTIN'); $('#bG')?.focus(); return; } if(!c.farmer){ toast('Business name needed'); $('#fName')?.focus(); return; } }
  if(c.ship&&c.ship.on){ const v=vehNorm(c.ship.vehicle); if(v&&!vehOk(v)){ toast('వాహనం నంబర్ సరిగా లేదు · Vehicle number looks wrong (like TS09AB1234)'); $('#shV')?.focus(); return; }
    const pin=c.b2b?c.pin:c.ship.pin; if(!pinOk(pin)){ toast('పిన్ కోడ్ రాయండి · Enter the buyer PIN code for the e-way bill'); (c.b2b?$('#bPin'):$('#shP'))?.focus(); return; } }
  const total=Math.round(cartTotal());
  if((m==='credit'||m==='part') && !c.farmer){ toast('బాకీకి రైతు పేరు కావాలి · Farmer name needed for udhaar'); $('#fName')?.focus(); return; }
  if(m==='part'){ numpad('ఎంత ఇచ్చారు? · How much paid?', 0, v=>{ commitSale(Math.min(total,v),'cash'); }); return; }
  commitSale(m==='credit'?0:total, m==='upi'?'upi':'cash');
}
async function commitSale(paid, mode){
  const c=cart(); const total=Math.round(cartTotal()); const credit=total-paid; const fs=c.fromScan;
  const when = c.date && /^\d{4}-\d{2}-\d{2}$/.test(c.date) && c.date<today() ? new Date(c.date+'T12:00:00').toISOString() : new Date().toISOString();
  let party=null;
  const b2b=c.b2b && regType()==='regular' && gstinValid(c.gstin);
  if(c.farmer){
    party=(b2b && S.parties.find(p=>!isSupplier(p) && p.gstin===c.gstin)) || S.parties.find(p=>!isSupplier(p) && norm(p.name)===norm(c.farmer) && (!c.village || !p.village || norm(p.village)===norm(c.village)));
    if(!party) party={id:nid('f'), name:c.farmer, village:c.village, phone:c.phone, due:0, hist:[]};
    party={...party, village:party.village||c.village, phone:c.phone||party.phone||'', hist:[...(party.hist||[])]};
    if(b2b){ party.kind='dealer'; party.address=c.addr||party.address||''; party.place=c.place||party.place||''; party.pin=c.pin||party.pin||''; if(c.ship&&num(c.ship.km)>0) party.km=num(c.ship.km); }
  }
  const iv=nextInvoiceNo(); const no=iv.seq;
  const pos=b2b?c.gstin.slice(0,2):shopState();
  if(b2b && party) party.gstin=c.gstin;
  const sale={id:nid('s'), no, inv:iv.inv, fy:iv.fy, t:when, fromPhoto:!!fs, by:ME||null, reg:regType(), pos, inter:pos!==shopState(),
    buyer: b2b?{name:c.farmer, gstin:c.gstin, address:c.addr||'', place:c.place||'', pin:c.pin||''}:(c.farmer?{name:c.farmer}:null),
    ship: c.ship&&c.ship.on ? {vehicle:vehNorm(c.ship.vehicle), km:c.ship.km||'', tr:c.ship.tr||'', trId:(c.ship.trId||'').toUpperCase(), pin:b2b?c.pin:c.ship.pin, place:b2b?c.place:(c.ship.place||c.village||'')} : null,
    ewb: c.ship&&c.ship.on ? {status:'pending'} : null,
    party: party?{id:party.id,name:party.name,village:party.village||'',phone:party.phone||''}:null,
    items:c.items.map(i=>{ const p=S.products.find(x=>x.id===i.pid); return {...i, cost:p?num(p.buy):0, amt:Math.round(i.qty*i.rate)}; }), total, paid, credit, mode:mode||'cash'};
  /* invoice counter is saved per device (counters), so the shared shop settings are not rewritten on every sale */
  await put('sales', sale);
  /* remove sold quantity from the place it was given from */
  const touched={};
  for(const i of c.items){ const p=touched[i.pid]||S.products.find(x=>x.id===i.pid); if(!p) continue; const loc={...p.loc}; loc[i.from]=Math.max(0,num(loc[i.from])-i.qty); touched[i.pid]={...p,loc, ...(b2b&&num(i.rate)>0?{dealer:num(i.rate)}:{})}; }
  for(const id in touched) await put('products', touched[id]);
  if(party){
    party.due=(party.due||0)+credit; party.last=sale.t;
    if(credit>0) party.hist.push({t:sale.t, type:'sale', amt:credit, ref:no});
    party.hist=party.hist.slice(-60);
    await put('parties', party);
  }
  S.cart=null; S.q=''; S.billId=sale.id; closeSheet(); go('bill');
  if(sale.ewb && ewbLinkReady() && !ewbProblems(sale).length) ewbGenerate(sale.id);
  if(fs) saleScanDone(fs);
  say(credit>0 ? `బిల్లు సేవ్ అయింది. ${party.name} బాకీ ${Math.round(party.due)} రూపాయలు.` : 'బిల్లు సేవ్ అయింది. స్టాక్ నుండి తీసేశాం.');
}

function P_DX(crop, note, farmer){ return `You are a careful crop-protection advisor helping an agri-input dealer in Telangana, India, answer a farmer at the shop counter.
The photo shows a sick plant, leaf, fruit, pest or field. Crop (from the dealer): ${crop||'not given'}.
What the farmer/dealer said: """${note||''}"""
Products the shop has in stock (JSON): ${JSON.stringify(S.products.filter(p=>p.qty>0&&['pesticide','fertilizer','other'].includes(p.cat)).map(p=>({id:p.id,name:p.name,company:p.company||'',cat:p.cat,pack:p.pack||''})))}

Rules:
- Name the most likely problem(s) (max 3) with honest confidence. If the photo is unclear or not a plant, say so and set see_officer true.
- Start with non-chemical / cultural steps (IPM): removing affected parts, water management, field sanitation, traps, balanced fertilizer.
- Suggest a chemical only if it is commonly registered in India (CIB&RC label claim) for THIS crop and THIS problem. Never suggest a banned or restricted pesticide, a mix of two pesticides, or a dose higher than the label. Give the label dose in plain units (e.g. "2 ml per litre water"). If you are not sure of the label claim or dose, leave it out.
- If confidence is low, give no chemical; tell them to show the Agriculture Extension Officer (AEO) or KVK.
- stock_ids: only ids from the stock list whose active ingredient really matches; empty if none.
- Always include safety: gloves, mask, no spraying against wind, no eating/smoking, waiting period before harvest as printed on the label.
- Telugu must be simple spoken Telugu a farmer understands.
Return ONLY JSON:
{"is_plant":boolean,"crop":string,"problems":[{"name_en":string,"name_te":string,"type":"insect"|"disease"|"nutrient"|"weed"|"water"|"other","confidence":"high"|"medium"|"low","signs_te":[string],"signs_en":[string]}],
"steps_te":[string],"steps_en":[string],
"treatments":[{"active_ingredient":string,"dose":string,"target":string,"stock_ids":[string]}],
"fertilizer_tip_te":string|null,"safety_te":[string],"see_officer":boolean,"summary_te":string,"summary_en":string}`; }

function vDx(d){

  ${(x.steps_te||[]).length?`<div class="card"><h3>ముందు ఇవి చేయండి · First do this</h3><ol style="margin:0;padding-left:22px">${x.steps_te.map((s,i)=>`<li>${esc(s)}${x.steps_en&&x.steps_en[i]?` <span class="note">(${esc(x.steps_en[i])})</span>`:''}</li>`).join('')}</ol></div>`:''}

   :`<button class="act blue" data-a="dxSave">${I.check} కేసు సేవ్ · Save this case</button>`}
  <button class="act ghost" data-a="dxNew">${I.cam} కొత్త ఫోటో · New photo</button>
  <p class="note">This is advice from a photo, not a lab test. For serious or unclear problems, contact the AEO, KVK or the Kisan Call Centre.</p>`;
}
async function thumbOf(blob){
  const bmp=await createImageBitmap(blob); const s=Math.min(1,420/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.6);
}
async function diagnose(blob){
  readDxForm();
  busy('పంటను చూస్తోంది… Checking the crop');
  try{
    const crop=S.dxCrop?cropName(S.dxCrop):'';
    const x=await ask(P_DX(crop, S.dxNote, S.dxF), [blob]);
    const thumb=await thumbOf(blob).catch(()=>null);
    S.dx={id:nid('c'), t:new Date().toISOString(), crop:S.dxCrop||'other', farmer:S.dxF||'', village:S.dxV||'', note:S.dxNote||'', thumb, dx:x, by:ME||null, saved:false};
    closeSheet(); window.scrollTo(0,0); render(); if(x.summary_te) say(x.summary_te);
  }catch(e){ closeSheet(); toast(aiError(e)); }
}
function readDxForm(){ const g=id=>($('#'+id)||{}).value; if($('#dxNote')){ S.dxNote=g('dxNote').trim(); S.dxF=g('dxF').trim(); S.dxV=g('dxV').trim(); } }
async function saveCase(){ const d=S.dx; if(!d) return; const {saved,...rec}=d; await put('cases', rec); d.saved=true; render(); toast('కేసు సేవ్ అయింది · Case saved'); }
function dxToBill(){
  const d=S.dx; const x=d.dx;
  const ids=[...new Set((x.treatments||[]).flatMap(t=>t.stock_ids||[]))].filter(id=>S.products.some(p=>p.id===id&&p.qty>0));
  ids.forEach(id=>{ if(!cart().items.some(i=>i.pid===id)) addToCart(id,1); });
  const c=cart(); if(d.farmer&&!c.farmer){ c.farmer=d.farmer; c.village=d.village; }
  if(!d.saved){ const {saved,...rec}=d; put('cases',rec); d.saved=true; }
  go('sell');
}

function vLesson(l, isDone){

  <button class="act blue" data-a="lessonSay">${I.speaker} మొత్తం వినండి · Hear the lesson</button>

function P_EXPLAIN(p){ return `An agri-input dealer in Telangana, India must explain this product to a farmer. Product: ${p.name} (${p.company||''}), pack ${p.pack||''}, type ${p.cat}.
Give what the product is commonly registered/used for in India, based on its label claims. Be careful: if you do not know the product well, say so and tell the dealer to read the label leaflet.
Return ONLY JSON: {"te":string,"en":string}
- te: simple spoken Telugu, 4-6 short sentences: what it is (active ingredient / nutrient), which crops and pests or uses, usual label dose in plain units, waiting period if relevant, 1-2 safety points. Never exceed label dose. End with "సీసా లేబుల్ చదివి డోస్ చెప్పండి".
- en: the same in simple English.`; }
async function explainProduct(p){
  busy('తెలుసుకుంటోంది…');
  try{ const r=await ask(P_EXPLAIN(p)); closeSheet();
    sheet(`<h2>${esc(p.name)}</h2><div class="answer"><p style="font-size:19px;font-weight:600">${esc(r.te||'')}</p><p class="note">${esc(r.en||'')}</p></div>
    <div class="alertbar warn">${I.warn}<span>Check the dose on the label leaflet before telling the farmer.</span></div>
    <button class="act blue" id="exSay">${I.speaker} మళ్లీ వినండి · Hear again</button><button class="act ghost" id="exClose">మూసివేయండి · Close</button>`);
    $('#exSay').onclick=()=>say(r.te); $('#exClose').onclick=closeSheet; if(r.te) say(r.te);
  }catch(e){ closeSheet(); toast(aiError(e)); }
}

/* ----- PRODUCT INFO (scan a bag / bottle, or explain a stock item) ----- */
function P_INFO(known){ return `You help an agri-input dealer in Telangana, India explain a product to farmers. ${known?`The product is: ${known}.`:'The photo shows a fertilizer bag, pesticide bottle/packet, or seed packet. Read the label, and the leaflet if visible.'}
Shop stock (match if same product): ${JSON.stringify(S.products.map(p=>({id:p.id,name:p.name,company:p.company||'',pack:p.pack||''})))}
Rules:
- Prefer what is printed on the label/leaflet. If dose per acre is not visible, give the commonly recommended label dose used in India for that product and crop, and set from_label false.
- Pesticides: only crops and pests in the product's Indian label claim (CIB&RC). Dose per acre in ml or g of product, plus water per acre in litres. Never above label dose. Include waiting period (days before harvest) if known.
- Fertilizers: nutrient content (e.g. 18-46-0), what it does, typical quantity per acre for common Telangana crops (paddy, cotton, maize, chilli, red gram) and when to apply (basal / top dressing). Remind that the Soil Health Card gives the exact need.
- If you cannot identify the product or are not sure of its uses, set found false or keep uses empty and say to read the leaflet or ask the AEO. Never guess doses.
- Telugu must be simple spoken Telugu with numbers as digits.
Return ONLY JSON:
{"found":boolean,"name":string,"company":string|null,"type":"fertilizer"|"pesticide"|"seed"|"other","content":string|null,"toxicity":"red"|"yellow"|"blue"|"green"|null,
"summary_te":string,"summary_en":string,
"uses":[{"crop_te":string,"crop_en":string,"target_te":string,"target_en":string,"per_acre":string,"water_per_acre":string|null,"when_te":string}],
"benefits_te":[string],"benefits_en":[string],"how_te":[string],"safety_te":[string],"waiting_days":string|null,"from_label":boolean,"stock_id":string|null}`; }

async function productInfo(blob, url, p){
  busy(blob?'లేబుల్ చదువుతోంది… Reading the label':'తెలుసుకుంటోంది…');
  try{
    const known = p ? `${p.name} (${p.company||''}), pack ${p.pack||''}, type ${p.cat}` : null;
    const r = await ask(P_INFO(known), blob?[blob]:undefined);
    if(p && !r.stock_id) r.stock_id=p.id;
    if(r.stock_id && !S.products.some(x=>x.id===r.stock_id)) r.stock_id=null;
    S.info={img:url||null, r}; closeSheet(); go('info');
    if(r.summary_te) say(r.summary_te);
  }catch(e){ closeSheet(); toast(aiError(e)); }
}
const TOX = {red:['#c0392b','ఎరుపు · Extremely toxic'],yellow:['#e3b505','పసుపు · Highly toxic'],blue:['#1f5fbf','నీలం · Moderately toxic'],green:['#2e8b57','ఆకుపచ్చ · Slightly toxic']};
function infoSpeech(r){
  const u=(r.uses||[]).slice(0,4).map(x=>`${x.crop_te} లో ${x.target_te} కోసం, ఎకరానికి ${x.per_acre}${x.water_per_acre?', '+x.water_per_acre+' నీటిలో':''}.`).join(' ');
  return [r.summary_te, u, (r.benefits_te||[]).slice(0,3).join('. '), r.waiting_days?`కోతకు ${r.waiting_days} ముందు ఆపాలి.`:''].filter(Boolean).join(' ');
}

function catSearch(q, limit=30){
  const n=norm(q); if(n.length<2) return [];
  return CATALOG.filter(c=>norm(c.name+' '+c.company+' '+c.content+' '+c.sub+' '+(SUBTE[c.sub]||'')).includes(n)).slice(0,limit);
}
function catMatch(name){
  const n=norm(name); if(n.length<3) return null;
  return CATALOG.find(c=>norm(c.name)===n) || CATALOG.find(c=>norm(c.name).length>3 && (n.includes(norm(c.name))||norm(c.name).includes(n))) || null;
}

/* ----- GST (Tally-style tax invoice, purchase register, monthly GST report) ----- */
const STATES = {'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh'};
const r2 = n => { n=Number(n)||0; return Math.sign(n)*Math.round(Math.abs(n)*100+1e-9)/100; };
const rs2 = n => '₹' + r2(n).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
const shopState = () => S.shop.state || '36';
const regType = () => S.shop.reg || 'regular';   // regular | composition | unregistered

/* GSTIN: 2-digit state + PAN + entity + Z + checksum */
function gstinValid(g){
  g=String(g||'').toUpperCase().trim();
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  if(!STATES[g.slice(0,2)]) return false;
  const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let sum=0;
  for(let i=0;i<14;i++){ const v=cs.indexOf(g[i])*((i%2)?2:1); sum+=Math.floor(v/36)+(v%36); }
  return cs[(36-(sum%36))%36]===g[14];
}

/* HSN + GST defaults (dealer can edit every product) */
const HSN_BY_NAME = [
  [/nano dap/i,'3105'],[/nano urea|urea/i,'3102'],[/ammonium sulphate|calcium nitrate/i,'3102'],
  [/\bdap\b|18-46-0|28-28-0|14-35-14|20-20-0|10-26-26|12-32-16|16-20-0|19-19-19|12-61-0/i,'3105'],
  [/super phosphate|\bssp\b/i,'3103'],[/potash|\bmop\b|\bsop\b|0-0-50/i,'3104'],
  [/13-0-45|potassium nitrate/i,'2834'],[/0-52-34|\bmkp\b/i,'2835'],
  [/zinc sulphate|magnesium sulphate/i,'2833'],[/boron|octaborate/i,'2840'],[/gypsum/i,'2520'],
  [/neem cake|vermicompost|compost|prom|azospirillum|\bpsb\b|rhizobium/i,'3101'],
  [/paddy|rice|arize/i,'1006'],[/maize|dkc|pioneer p3396|30v92|nk 6240|nk 30|kaveri 50/i,'1005'],
  [/bg-ii|cotton/i,'1207'],[/groundnut/i,'1202'],[/sunflower/i,'1206'],[/jowar|sorghum/i,'1007'],
  [/red gram|bengal gram|green gram|black gram/i,'0713'],[/chilli|tomato|brinjal|bhendi|okra|onion|fodder/i,'1209']
];
function defaultHsn(name, cat, sub){
  for(const [re,h] of HSN_BY_NAME) if(re.test(name||'')) return h;
  if(cat==='pesticide' && sub!=='trap') return '3808';
  if(cat==='pesticide' && /pheromone/i.test(name||'')) return '3808';
  return '';
}
const BIO5 = /trichoderma|pseudomonas|beauveria|bacillus|neem|azadirachtin|gibberellic|npv/i;
function defaultGst(name, cat){
  if(cat==='seed') return 0;
  if(cat==='fertilizer') return 5;
  if(cat==='pesticide') return BIO5.test(name||'') ? 5 : 18;
  return num(S.shop.gst.other ?? 18);
}

/* financial year (Apr–Mar) like 2526 */
function fyOf(d){ d=new Date(d); const y=d.getFullYear(), m=d.getMonth(); const s=m>=3?y:y-1; return String(s%100).padStart(2,'0')+String((s+1)%100).padStart(2,'0'); }
/* each device keeps its own invoice series (allowed under GST), so two devices offline never give the same number */
function devCode(){ const K=window.KK; if(!K || K.mode==='desktop' || K.mode==='alone' || !ME) return ''; if(K.devCode) return String(K.devCode).toUpperCase(); return 'P'+String(ME).replace(/[^a-z0-9]/gi,'').slice(-1).toUpperCase(); }
/* GST invoice numbers may have at most 16 characters (Rule 46): KK/2627/0001, phone B: KK/2627/B0001 */
function invNo(pre, fy, dc, n){ pre=String(pre||'KK').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)||'KK'; return `${pre}/${fy}/${dc||''}${String(n).padStart(4,'0')}`; }
function counterDoc(){ const id=ME||'local'; return S.counters.find(c=>c.id===id) || {id, inv:{}, cn:{}}; }
function bumpCounter(kind, fy){
  const c=JSON.parse(JSON.stringify(counterDoc())); c[kind]=c[kind]||{};
  let n=(c[kind][fy]||0)+1;
  if(!devCode()){ const old=kind==='inv'?(S.shop.series||{})[fy]:(S.shop.cnSeries||{})[fy]; if(old && old>=n) n=old+1; }   /* carry on from older single-series numbers */
  c[kind][fy]=n; put('counters', c); return n;
}
function nextInvoiceNo(){
  const fy=fyOf(new Date()); const n=bumpCounter('inv', fy); const dc=devCode();
  const pre=(S.shop.prefix||'KK').toUpperCase();
  return {inv:invNo(pre, fy, dc, n), fy, seq:n};
}

/* amount in words, Indian system */
function words(n){
  n=Math.round(n); if(n===0) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  let out=[]; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(three(cr)+' Crore'); if(lk) out.push(two(lk)+' Lakh'); if(th) out.push(two(th)+' Thousand'); if(n) out.push(three(n));
  return out.join(' ');
}

/* compute invoice lines from inclusive (MRP) prices */
function calcInvoice(s){
  const inter = !!s.inter; const comp = (s.reg||regType())!=='regular';
  const lines = s.items.map(i=>{
    const amt = r2(num(i.qty)*num(i.rate)); const g = comp?0:num(i.gst);
    const taxable = r2(amt/(1+g/100)); const tax = r2(amt-taxable);
    return {...i, hsn:i.hsn||defaultHsn(i.name,i.cat), amt, g, taxable, igst:inter?tax:0, cgst:inter?0:r2(tax/2), sgst:inter?0:r2(tax-r2(tax/2)), unitTaxable:r2(taxable/Math.max(1,num(i.qty)))};
  });
  const sum=k=>r2(lines.reduce((a,l)=>a+l[k],0));
  const gross=sum('amt'); const total=Math.round(gross);
  const byHsn={}; lines.forEach(l=>{ const k=(l.hsn||'-')+'|'+l.g; const o=byHsn[k]||(byHsn[k]={hsn:l.hsn||'-',g:l.g,taxable:0,cgst:0,sgst:0,igst:0,qty:0,desc:l.name,unit:l.unit||l.pack||''}); o.taxable=r2(o.taxable+l.taxable); o.cgst=r2(o.cgst+l.cgst); o.sgst=r2(o.sgst+l.sgst); o.igst=r2(o.igst+l.igst); o.qty+=num(l.qty); });
  return {lines, taxable:sum('taxable'), cgst:sum('cgst'), sgst:sum('sgst'), igst:sum('igst'), gross, total, round:r2(total-gross), hsn:Object.values(byHsn)};
}
function docTitle(s, calc){
  const reg=s.reg||regType();
  if(reg==='unregistered') return 'Cash Memo / Invoice';
  if(reg==='composition') return 'Bill of Supply';
  const taxed=calc.lines.some(l=>l.g>0), exempt=calc.lines.some(l=>l.g===0);
  if(!taxed) return 'Bill of Supply';
  if(exempt && !(s.buyer&&s.buyer.gstin)) return 'Invoice-cum-Bill of Supply';
  return 'Tax Invoice';
}

/* ===== DEALER SALES + E-WAY BILL =====
   A dealer sale is a B2B tax invoice to a retailer / sub-dealer (their GSTIN, address, PIN).
   When goods worth more than the limit move by vehicle, an e-way bill is needed before they leave.
   Three ways to get it:
   1. direct: the shop computer asks the government system through a GST Suvidha Provider (no portal login)
   2. portal file: download one JSON file, upload it at ewaybillgst.gov.in → e-Way Bill → Generate Bulk
   3. made elsewhere: type the 12-digit number, or photograph the e-way bill QR */
const EWB_JSON_VERSION = '1.0.0621';

const pinOk = p => /^[1-9][0-9]{5}$/.test(String(p||'').trim());
const vehOk = v => /^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/.test(v) || /^TR[0-9A-Z]{5,13}$/.test(v) || /^(TM|DF|BP|BG)[0-9A-Z]{4,13}$/.test(v);
const vehNorm = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const ewbFmt = n => String(n||'').replace(/(\d{4})(?=\d)/g,'$1 ');
function dealers(){ return S.parties.filter(p=>!isSupplier(p) && (p.kind==='dealer' || p.gstin)).sort((a,b)=>(b.last||'').localeCompare(a.last||'')); }
function cartInter(c){ return !!(c.b2b && gstinValid(c.gstin) && c.gstin.slice(0,2)!==shopState()); }
/* consignment value for the limit: goods that carry GST, with GST. Seeds (0% GST, exempt) are not counted (Rule 138). */
function ewbValue(items){ return Math.round(items.filter(i=>num(i.gst)>0).reduce((a,i)=>a+num(i.qty)*num(i.rate),0)); }

function ewbValidity(genIso, km){ const days=Math.max(1, Math.ceil((num(km)||1)/200)); const d=new Date(genIso); d.setDate(d.getDate()+days); d.setHours(23,59,0,0); return d.toISOString(); }
const localDT = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
const dt = iso => iso ? new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';

    itemList:c.lines.map((l,i)=>({itemNo:i+1, productName:l.name.slice(0,100), productDesc:`${l.name} ${l.pack||''}`.trim().slice(0,100), hsnCode:Number(String(l.hsn||'').replace(/\D/g,''))||0,
      quantity:num(l.qty), qtyUnit:UQC[l.unit]||'OTH', taxableAmount:l.taxable, sgstRate:s.inter?0:l.g/2, cgstRate:s.inter?0:l.g/2, igstRate:s.inter?l.g:0, cessRate:0, cessNonAdvol:0}))

/* same request in the portal's bulk-upload file layout */
function ewbBulkEntry(s){
  const p=ewbPayload(s); const top=p.itemList.slice().sort((a,b)=>b.taxableAmount-a.taxableAmount)[0];
  const {actFromStateCode, actToStateCode, otherValue, cessNonAdvolValue, dispatchFromGSTIN, dispatchFromTradeName, shipToGSTIN, shipToTradeName, ...rest} = p;
  return {userGstin:gstin(), ...rest, actualFromStateCode:actFromStateCode, actualToStateCode:actToStateCode, OthValue:otherValue, TotNonAdvolVal:cessNonAdvolValue, mainHsnCode:top?top.hsnCode:0};

/* everything the government system would reject, said simply, before we send */
function ewbProblems(s){
  const out=[], sh=S.shop, b=s.buyer||{}, sp=s.ship||{};
  if((s.reg||regType())==='unregistered') out.push('Your shop has no GSTIN. Only GST-registered shops make e-way bills here.');
  if(!gstinValid(gstin())) out.push('Your shop GSTIN is missing or wrong (Settings).');
  if(!pinOk(sh.pin)) out.push('Your shop PIN code is missing (Settings → GST setup).');
  if(!sh.place) out.push('Your shop town is missing (Settings → GST setup).');
  if(b.gstin && !gstinValid(b.gstin)) out.push('Buyer GSTIN looks wrong.');
  if(!(b.name||(s.party&&s.party.name))) out.push('Buyer name is missing.');
  if(!pinOk(b.pin||sp.pin)) out.push('Buyer PIN code is missing.');
  if(!(b.place||sp.place||(s.party&&s.party.village))) out.push('Buyer town / village is missing.');
  const noHsn=calcInvoice(s).lines.filter(l=>String(l.hsn||'').replace(/\D/g,'').length<4).map(l=>l.name);
  if(noHsn.length) out.push('HSN code missing for: '+noHsn.join(', ')+' (Stock → tap item → HSN).');
  if(!s.inv || s.inv.length>16 || !/^[A-Za-z1-9][A-Za-z0-9/-]*$/.test(s.inv)) out.push(`Invoice number ${s.inv||''} is not in a form the system accepts (max 16 letters, digits, / or -).`);
  const v=vehNorm(sp.vehicle); if(v && !vehOk(v)) out.push(`Vehicle number ${v} does not look right (like TS09AB1234).`);
  if(num(sp.km)>4000) out.push('Distance cannot be more than 4000 km.');
  if(num(sp.km)<0) out.push('Distance cannot be negative.');
  return out;
}

async function recordPurchase(ib, items){
  if(!ib.supplier && !ib.supplier_gstin && !ib.invoice_no) return;
  const lines=items.map(it=>{ const qty=num(it.qty), rate=num(it.buy_rate), g=num(it.gst); const amt=r2(qty*rate); const taxable=r2(amt/(1+g/100)); return {name:it.name, hsn:it.hsn||'', qty, rate, g, amt, taxable, tax:r2(amt-taxable)}; });
  const sg=String(ib.supplier_gstin||'').toUpperCase(); const inter = gstinValid(sg) && sg.slice(0,2)!==shopState();
  const total=r2(lines.reduce((a,l)=>a+l.amt,0)); const pay=ib.pay||'credit'; const paid=pay==='credit'?0:total;
  let sup=null; if(ib.supplier){ sup=findParty(ib.supplier,'supplier',{gstin:sg})||{id:nid('f'),kind:'supplier',name:ib.supplier,gstin:sg,due:0,hist:[]}; if(sg&&!sup.gstin) sup.gstin=sg; }
  await put('purchases', {id:nid('pu'), t:new Date().toISOString(), date:ib.invoice_date||today(), supplier:ib.supplier||'', partyId:sup?sup.id:null, gstin:sg, invoice_no:ib.invoice_no||'', inter,
    lines, taxable:r2(lines.reduce((a,l)=>a+l.taxable,0)), tax:r2(lines.reduce((a,l)=>a+l.tax,0)), total, paid, mode:pay==='credit'?null:pay});
  if(sup) await bumpParty(sup, r2(total-paid), {type:'purchase', amt:r2(total-paid), ref:ib.invoice_no||''});
}

/* ---- monthly GST report ---- */
function monthSales(m){ return S.sales.filter(s=>ld(s.t).slice(0,7)===m); }
function gstReport(m){
  const cns=S.vouchers.filter(v=>v.kind==='return'&&ld(v.t).slice(0,7)===m).map(v=>({...v, no:'', inv:v.cn, items:v.items.map(i=>({...i, qty:-num(i.qty)})), paid:-(v.refund?num(v.amount):0), credit:0, reg:regType()}));
  const sales=[...monthSales(m), ...cns].map(s=>({s, c:calcInvoice(s)}));
  const rate={}, b2b=[], b2cs={}, hsn={};
  for(const {s,c} of sales){
    for(const l of c.lines){
      const r=rate[l.g]||(rate[l.g]={g:l.g,taxable:0,cgst:0,sgst:0,igst:0}); r.taxable=r2(r.taxable+l.taxable); r.cgst=r2(r.cgst+l.cgst); r.sgst=r2(r.sgst+l.sgst); r.igst=r2(r.igst+l.igst);
      const hk=(l.hsn||'-')+'|'+l.g; const h=hsn[hk]||(hsn[hk]={hsn:l.hsn||'-',desc:l.name,uqc:(l.unit||'').toUpperCase(),qty:0,g:l.g,taxable:0,igst:0,cgst:0,sgst:0,value:0});
      h.qty+=num(l.qty); h.taxable=r2(h.taxable+l.taxable); h.igst=r2(h.igst+l.igst); h.cgst=r2(h.cgst+l.cgst); h.sgst=r2(h.sgst+l.sgst); h.value=r2(h.value+l.amt);
      if(!(s.buyer&&s.buyer.gstin)){ const pos=s.pos||shopState(); const k=pos+'|'+l.g; const o=b2cs[k]||(b2cs[k]={pos,g:l.g,taxable:0,igst:0,cgst:0,sgst:0}); o.taxable=r2(o.taxable+l.taxable); o.igst=r2(o.igst+l.igst); o.cgst=r2(o.cgst+l.cgst); o.sgst=r2(o.sgst+l.sgst); }
    }
    if(s.buyer&&s.buyer.gstin) b2b.push({inv:s.inv||('#'+s.no), date:new Date(s.t).toLocaleDateString('en-IN'), name:s.buyer.name||'', gstin:s.buyer.gstin, pos:s.pos||shopState(), value:c.total, taxable:c.taxable, igst:c.igst, cgst:c.cgst, sgst:c.sgst});
  }
  const pur=S.purchases.filter(p=>(p.date||ld(p.t)).slice(0,7)===m);
  const out=Object.values(rate).reduce((a,r)=>a+r.cgst+r.sgst+r.igst,0);
  const itc=pur.reduce((a,p)=>a+num(p.tax),0);
  return {sales, rate:Object.values(rate).sort((a,b)=>a.g-b.g), b2b, b2cs:Object.values(b2cs), hsn:Object.values(hsn), pur, out:r2(out), itc:r2(itc), net:r2(out-itc),
    turnover:r2(sales.reduce((a,x)=>a+x.c.total,0)), exempt:r2((rate[0]||{taxable:0}).taxable)};
}

let XLSXP=null;
function loadXlsx(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(XLSXP) return XLSXP;
  XLSXP=new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='vendor/xlsx.full.min.js'; sc.onload=()=>ok(window.XLSX); sc.onerror=()=>{ XLSXP=null; no(new Error('load')); }; document.head.appendChild(sc); }); return XLSXP; }
async function gstExport(){
  const m=S.gm||thisMonth(); const R=gstReport(m);
  let X; try{ X=await loadXlsx(); }catch(e){ toast('Could not prepare Excel. Check internet.'); return; }
  const wb=X.utils.book_new(); const add=(name,rows)=>X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length?rows:[{Note:'No data'}]), name);
  const sh=S.shop;
  add('Summary',[{Shop:sh.name||'',GSTIN:gstin(),State:shopState()+' '+(STATES[shopState()]||''),Month:m,Registration:regType(),Bills:R.sales.length,'Total sales':R.turnover,'Output tax':R.out,'Input credit (purchases)':R.itc,'Approx. net tax':R.net}]);
  const reg=[]; for(const {s,c} of R.sales) for(const l of c.lines) reg.push({'Invoice No':s.inv||('#'+s.no),'Date':new Date(s.t).toLocaleDateString('en-IN'),'Buyer':(s.buyer&&s.buyer.name)||(s.party&&s.party.name)||'Cash','Buyer GSTIN':(s.buyer&&s.buyer.gstin)||'','Place of supply':s.pos||shopState(),'Item':l.name,'HSN':l.hsn||'','Qty':num(l.qty),'Unit':l.unit||'','Rate incl GST':num(l.rate),'GST %':l.g,'Taxable':l.taxable,'CGST':l.cgst,'SGST':l.sgst,'IGST':l.igst,'Line total':l.amt,'Invoice total':c.total,'Paid':s.paid,'Udhaar':s.credit});
  add('Sales register',reg);
  add('B2B',R.b2b.map(b=>({'GSTIN of recipient':b.gstin,'Receiver name':b.name,'Invoice number':b.inv,'Invoice date':b.date,'Invoice value':b.value,'Place of supply':b.pos+'-'+(STATES[b.pos]||''),'Reverse charge':'N','Invoice type':'Regular B2B','Taxable value':b.taxable,'IGST':b.igst,'CGST':b.cgst,'SGST':b.sgst})));
  add('B2CS',R.b2cs.map(b=>({'Type':'OE','Place of supply':b.pos+'-'+(STATES[b.pos]||''),'Rate':b.g,'Taxable value':b.taxable,'IGST':b.igst,'CGST':b.cgst,'SGST':b.sgst})));

  add('Purchases',R.pur.map(p=>({'Date':p.date,'Supplier':p.supplier,'Supplier GSTIN':p.gstin,'Bill no':p.invoice_no,'Interstate':p.inter?'Y':'N','Taxable':p.taxable,'GST':p.tax,'Total':p.total})));
  const data=X.write(wb,{bookType:'xlsx',type:'array'});
  let D=null; try{ D=await claude.use('downloads'); }catch(e){}
  if(!D){ toast('Download is not available here.'); return; }

  catch(e){ if(e&&e.code!=='declined') toast('Could not save the file.'); }

/* ===== ACCOUNTS (Tally-style books, simpler) ===== */
const MODES = {cash:'నగదు · Cash', upi:'UPI / PhonePe', bank:'బ్యాంకు · Bank'};
const EXP_HEADS = [['rent','అద్దె · Rent'],['salary','జీతాలు · Salary'],['electricity','కరెంట్ · Electricity'],['transport','రవాణా · Transport'],['hamali','హమాలీ · Loading/Hamali'],['shop','షాప్ ఖర్చు · Shop expenses'],['phone','ఫోన్/నెట్ · Phone'],['repair','రిపేర్ · Repairs'],['food','టీ/భోజనం · Tea & food'],['bankchg','బ్యాంకు ఛార్జీ · Bank charges'],['drawings','సొంత ఖర్చు · Owner took'],['other','ఇతర · Other']];
const expName = k => (EXP_HEADS.find(e=>e[0]===k)||[k,k])[1];
const modeOf = x => (x&&MODES[x])?x:'cash';
let ISOWNER = true;
const canSeeMoney = () => ISOWNER || !S.shop.staffHide;

function monthStart(){ return thisMonth()+'-01'; }
function inRange(t, from, to){ const d=ld(t); return d>=from && d<=to; }
function period(){ return {from:S.pf||monthStart(), to:S.pt||today()}; }
function periodPicker(){ const p=period(); return `<div class="fgrid"><label class="f">నుండి · From<input type="date" id="pf" value="${p.from}"></label><label class="f">వరకు · To<input type="date" id="pt" value="${p.to}"></label></div>`; }

function modeChips(sel, act){ return `<div class="chips">${Object.entries(MODES).map(([k,v])=>`<button class="chip ${sel===k?'on':''}" data-a="${act}" data-m="${k}">${v}</button>`).join('')}</div>`; }

/* ---- party helpers (customers & suppliers live in parties; kind:'supplier' for suppliers) ---- */
const isSupplier = p => p.kind==='supplier';
function findParty(name, kind, extra){
  const n=norm(name); if(!n) return null;
  return S.parties.find(p=>(kind==='supplier'?isSupplier(p):!isSupplier(p)) && (norm(p.name)===n || (extra&&extra.gstin&&p.gstin===extra.gstin)));
}
async function bumpParty(p, delta, h){
  const np={...p, due:r2((p.due||0)+delta), hist:[...(p.hist||[]), {t:new Date().toISOString(), by:ME||null, ...h}].slice(-400), last:new Date().toISOString()};
  await put('parties', np); return np;
}

/* ---- vouchers: receipt, payment, expense, contra, return ---- */
async function voucher(kind, v){ const o={id:nid('v'), kind, t:new Date().toISOString(), by:ME||null, ...v}; await put('vouchers', o); return o; }

/* ---- books: compute from sales, purchases and vouchers ---- */
function flows(from, to){
  const F=[]; // {t, type, label, mode, in, out, ref}
  for(const s of S.sales){ if(!inRange(s.t,from,to)) continue; if(num(s.paid)>0) F.push({t:s.t,type:'Sale',label:`${s.inv||'#'+s.no} · ${s.party?s.party.name:'Cash'}`,mode:modeOf(s.mode),in:num(s.paid),out:0,id:s.id}); }
  for(const p of S.purchases){ if(!inRange(p.t,from,to)) continue; if(num(p.paid)>0) F.push({t:p.t,type:'Purchase',label:`${p.supplier||''} ${p.invoice_no||''}`,mode:modeOf(p.mode),in:0,out:num(p.paid)}); }
  for(const v of S.vouchers){ if(!inRange(v.t,from,to)) continue;
    if(v.kind==='receipt') F.push({t:v.t,type:'Receipt',label:v.party||'',mode:modeOf(v.mode),in:num(v.amount),out:0});
    if(v.kind==='payment') F.push({t:v.t,type:'Payment',label:v.party||'',mode:modeOf(v.mode),in:0,out:num(v.amount)});
    if(v.kind==='expense') F.push({t:v.t,type:'Expense',label:expName(v.head)+(v.note?' · '+v.note:''),mode:modeOf(v.mode),in:0,out:num(v.amount)});
    if(v.kind==='return' && v.refund) F.push({t:v.t,type:'Return refund',label:`${v.cn||''} · ${v.party||''}`,mode:modeOf(v.refund),in:0,out:num(v.amount)});
    if(v.kind==='contra'){ F.push({t:v.t,type:'Contra',label:`${short(MODES[v.from])} → ${short(MODES[v.to])}`,mode:v.from,in:0,out:num(v.amount)}); F.push({t:v.t,type:'Contra',label:`${short(MODES[v.from])} → ${short(MODES[v.to])}`,mode:v.to,in:num(v.amount),out:0}); }
  }
  return F.sort((a,b)=>a.t.localeCompare(b.t));
}
function balanceUpto(mode, dateExcl){
  const o=S.shop.open||{}; let b=num(o[mode]);
  for(const f of flows('0000-01-01', prevDay(dateExcl))) if(f.mode===mode) b+=f.in-f.out;
  return r2(b);
}
function prevDay(d){ const x=new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()-1); return x.toISOString().slice(0,10); }

/* ---- cost & profit ---- */
function costOf(item){ const p=S.products.find(x=>x.id===item.pid); const buy=num(item.cost ?? (p&&p.buy) ?? 0); const g=num(item.gst); return regType()==='regular' ? buy/(1+g/100) : buy; }
function profitLoss(from,to){
  let sales=0, cogs=0; const items={};
  for(const s of S.sales){ if(!inRange(s.t,from,to)) continue; const c=calcInvoice(s);
    for(const l of c.lines){ const cost=r2(costOf(l)*num(l.qty)); const rev=regType()==='regular'?l.taxable:l.amt; sales+=rev; cogs+=cost; const k=l.name; const o=items[k]||(items[k]={name:k,qty:0,rev:0,cost:0}); o.qty+=num(l.qty); o.rev+=rev; o.cost+=cost; } }
  let ret=0, retCost=0;
  for(const v of S.vouchers){ if(v.kind!=='return'||!inRange(v.t,from,to)) continue; const c=calcInvoice({items:v.items, inter:v.inter});
    for(const l of c.lines){ const rev=regType()==='regular'?l.taxable:l.amt; ret+=rev; retCost+=r2(costOf(l)*num(l.qty)); const o=items[l.name]; if(o){ o.qty-=num(l.qty); o.rev-=rev; o.cost-=r2(costOf(l)*num(l.qty)); } } }
  const exp={}; let expTot=0, drawings=0;
  for(const v of S.vouchers){ if(v.kind!=='expense'||!inRange(v.t,from,to)) continue; if(v.head==='drawings'){ drawings+=num(v.amount); continue; } exp[v.head]=(exp[v.head]||0)+num(v.amount); expTot+=num(v.amount); }
  const netSales=r2(sales-ret), netCogs=r2(cogs-retCost), gross=r2(netSales-netCogs), net=r2(gross-expTot);
  const list=Object.values(items).map(o=>({...o, profit:r2(o.rev-o.cost), margin:o.rev?Math.round((o.rev-o.cost)/o.rev*100):0})).sort((a,b)=>b.profit-a.profit);
  return {sales:r2(sales), ret:r2(ret), netSales, cogs:netCogs, gross, exp, expTot:r2(expTot), net, drawings:r2(drawings), items:list};
}
function stockValue(){ return r2(S.products.reduce((a,p)=>a+num(p.qty)*num(p.buy),0)); }
function receivables(){ return r2(S.parties.filter(p=>!isSupplier(p)).reduce((a,p)=>a+Math.max(0,num(p.due)),0)); }
function payables(){ return r2(S.parties.filter(isSupplier).reduce((a,p)=>a+Math.max(0,num(p.due)),0)); }

/* ---- ageing of customer dues (oldest unpaid first) ---- */
function ageing(p){
  let due=Math.max(0,num(p.due)); const buckets={a:0,b:0,c:0,d:0}; if(!due) return buckets;
  const debits=(p.hist||[]).filter(h=>h.type==='sale'||h.type==='opening'||h.type==='purchase').slice().reverse();
  for(const h of debits){ if(due<=0) break; const amt=Math.min(due,num(h.amt)); due-=amt; const days=(Date.now()-new Date(h.t))/864e5; buckets[days<=30?'a':days<=60?'b':days<=90?'c':'d']+=amt; }
  if(due>0) buckets.d+=due; return buckets;
}

function nextDay(d){ const x=new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+1); return x.toISOString().slice(0,10); }

function vDay(){
  const d=S.dayD||today();

  for(const s of S.sales) if(ld(s.t)===d) rows.push({t:s.t,type:'Sale',what:`${s.inv||'#'+s.no} · ${s.party?s.party.name:'Cash'}`,amt:s.total,extra:s.credit>0?`udhaar ${rs(s.credit)}`:short(MODES[modeOf(s.mode)]),id:s.id});
  for(const p of S.purchases) if(ld(p.t)===d) rows.push({t:p.t,type:'Purchase',what:`${p.supplier||''} ${p.invoice_no||''}`,amt:p.total,extra:num(p.paid)>0?short(MODES[modeOf(p.mode)]):'credit'});
  for(const v of S.vouchers) if(ld(v.t)===d){
    const lab={receipt:'Receipt',payment:'Payment',expense:'Expense',contra:'Contra',return:'Credit note'}[v.kind]||v.kind;
    rows.push({t:v.t,type:lab,what:v.kind==='expense'?expName(v.head)+(v.note?' · '+v.note:''):v.kind==='contra'?`${short(MODES[v.from])} → ${short(MODES[v.to])}`:(v.party||'')+(v.cn?' · '+v.cn:''),amt:v.amount,extra:v.mode?short(MODES[modeOf(v.mode)]):(v.refund?'refund '+short(MODES[v.refund]):'')});
  }

  <div class="tile"><div class="n">${rs(sum('Purchase'))}</div><div class="l">Purchases</div></div><div class="tile"><div class="n">${rs(sum('Expense')+sum('Payment'))}</div><div class="l">Expenses + payments</div></div></div>

function ledgerRows(p){
  const rows=[];

    for(const pu of S.purchases) if(pu.partyId===p.id || (!pu.partyId && norm(pu.supplier)===norm(p.name))){ rows.push({t:pu.t,what:`Purchase ${pu.invoice_no||''}`,dr:0,cr:num(pu.total)}); if(num(pu.paid)>0) rows.push({t:pu.t,what:`Paid at purchase (${short(MODES[modeOf(pu.mode)])})`,dr:num(pu.paid),cr:0}); }
    for(const h of p.hist||[]) if(h.type==='pay') rows.push({t:h.t,what:`Payment (${short(MODES[modeOf(h.mode)])})`,dr:num(h.amt),cr:0}); else if(h.type==='opening') rows.push({t:h.t,what:'Opening balance',dr:0,cr:num(h.amt)});

async function storeImg(blob){
  const bmp=await createImageBitmap(blob);
  for(const [px,q] of [[1100,0.62],[900,0.55],[700,0.5]]){
    const s=Math.min(1,px/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); const u=c.toDataURL('image/jpeg',q); if(u.length<220000) return u;
  }
  return null;
}

/* ---- e-invoice QR (signed by NIC for bigger suppliers): exact supplier GSTIN, bill no, date, total ---- */
let JSQRP=null;
function loadJsQR(){ if(window.jsQR) return Promise.resolve(); if(JSQRP) return JSQRP; JSQRP=new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='vendor/jsQR.js'; s.onload=ok; s.onerror=()=>{JSQRP=null;no();}; document.head.appendChild(s); }); return JSQRP; }
function b64url(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function parseEinvoiceQR(txt){
  try{
    const parts=String(txt||'').split('.'); if(parts.length<2) return null;
    let p=JSON.parse(b64url(parts[1])); if(typeof p.data==='string') p=JSON.parse(p.data); else if(p.data) p=p.data;
    if(!p.SellerGstin && !p.DocNo) return null;
    const d=String(p.DocDt||''); const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return {gstin:String(p.SellerGstin||'').toUpperCase(), buyer:String(p.BuyerGstin||'').toUpperCase(), no:String(p.DocNo||''), date:m?`${m[3]}-${m[2]}-${m[1]}`:(/^\d{4}-\d{2}-\d{2}$/.test(d)?d:''), total:num(p.TotInvVal), items:num(p.ItemCnt), hsn:String(p.MainHsnCode||''), irn:String(p.Irn||''), type:String(p.DocTyp||'')};
  }catch(e){ return null; }
}
async function findQR(blob, parse=parseEinvoiceQR){
  try{
    const bmp=await createImageBitmap(blob);
    if('BarcodeDetector' in window){ try{ const det=new BarcodeDetector({formats:['qr_code']}); const r=await det.detect(bmp); for(const c of r){ const q=parse(c.rawValue); if(q) return q; } }catch(e){} }
    await loadJsQR();
    const tries=[[0,0,1,1],[0,0,1,.5],[0,.5,1,.5],[.5,0,.5,.5],[0,0,.5,.5]];
    for(const [x,y,w,h] of tries){
      const sw=Math.round(bmp.width*w), sh=Math.round(bmp.height*h), sc=Math.min(1,1400/Math.max(sw,sh));
      const c=document.createElement('canvas'); c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
      const g=c.getContext('2d',{willReadFrequently:true}); g.drawImage(bmp, bmp.width*x, bmp.height*y, sw, sh, 0, 0, c.width, c.height);
      const d=g.getImageData(0,0,c.width,c.height); const code=window.jsQR(d.data, c.width, c.height, {inversionAttempts:'attemptBoth'});
      if(code){ const q=parse(code.data); if(q) return q; }
    }
  }catch(e){}
  return null;
}

/* ---- learning: what each supplier calls a product ---- */
function aliasDoc(supplier){ const k='al_'+(norm(supplier)||'any').slice(0,40); return S.aliases.find(a=>a.id===k)||{id:k, supplier:supplier||'', map:{}}; }
async function learnAliases(supplier, pairs){
  const a=aliasDoc(supplier); const map={...a.map}; let changed=false;
  for(const [raw,name] of pairs){ const k=norm(raw); if(k && name && map[k]!==name){ map[k]=name; changed=true; } }
  if(changed) await put('aliases', {...a, supplier:supplier||a.supplier, map});
}
const knownNames = () => [...new Set(S.products.map(p=>`${p.name}${p.pack?' ('+p.pack+')':''}`))].slice(0,150);

/* ---- checks: the arithmetic and the rules a bill must follow ---- */
function checkBill(res, qr){
  const issues=[], ok=[];
  const items=res.items||[];
  items.forEach((it,i)=>{
    it._flags=[];
    const q=num(it.qty), r=num(it.rate), a=num(it.amount), g=num(it.gst);
    if(q<=0) it._flags.push('qty');
    if(r>0 && a>0){ const plain=q*r, withTax=q*r*(1+g/100), tol=Math.max(2, a*0.012);
      if(Math.abs(plain-a)>tol && Math.abs(withTax-a)>tol){ it._flags.push('math'); issues.push(`item ${i+1} (${it.name}): ${q} × ${r} ≠ ${a}`); } }
    if(it.gst!=null && ![0,5,12,18,28].includes(g)){ it._flags.push('gst'); issues.push(`item ${i+1}: GST ${g}% is not a valid rate`); }
    if(it.category==='pesticide' && g && g!==18 && !BIO5.test(it.name||'')){ it._flags.push('gst'); issues.push(`item ${i+1}: chemical pesticide should be 18% GST`); }
    if(it.category==='fertilizer' && g && g!==5){ it._flags.push('gst'); issues.push(`item ${i+1}: fertilizer should be 5% GST`); }
    if(it.hsn && !/^\d{4}(\d{2}){0,2}$/.test(String(it.hsn))){ it._flags.push('hsn'); issues.push(`item ${i+1}: HSN ${it.hsn} looks wrong`); }
    if((it.category==='pesticide'||it.category==='seed') && !it.batch){ it._flags.push('batch'); }
    if(it.expiry && res.invoice_date && it.expiry < res.invoice_date.slice(0,7)){ it._flags.push('expiry'); issues.push(`item ${i+1}: expiry ${it.expiry} is before the bill date`); }
    if(it.confidence==='low') it._flags.push('low');
  });
  const sumAmt=r2(items.reduce((s,it)=>s+num(it.amount || num(it.qty)*num(it.rate)),0));
  const total=num(res.bill_total)|| (qr&&qr.total) || 0;
  if(total){ const tol=Math.max(3, total*0.006);
    const close=[sumAmt, r2(sumAmt+num(res.tax_total))].some(v=>Math.abs(v-total)<=tol);
    if(close) ok.push(`Items add up to the bill total ${rs(total)}`); else issues.push(`items add up to ${rs(sumAmt)} (or ${rs(sumAmt+num(res.tax_total))} with tax) but the bill total is ${rs(total)}`);
  }
  if(res.supplier_gstin){ if(gstinValid(res.supplier_gstin)) ok.push('Supplier GSTIN is valid'); else issues.push(`supplier GSTIN ${res.supplier_gstin} fails the check digit`); }
  if(qr){
    ok.push('Read from the e-invoice QR code: GSTIN, bill no, date and total are exact');
    if(qr.items && items.length && qr.items!==items.length) issues.push(`QR says ${qr.items} items but ${items.length} were read`);
    if(qr.buyer && gstin() && qr.buyer!==gstin()) issues.push(`this e-invoice is billed to GSTIN ${qr.buyer}, not your shop`);
  }
  const dup=S.purchases.find(p=>p.invoice_no && res.invoice_no && norm(p.invoice_no)===norm(res.invoice_no) && (norm(p.supplier)===norm(res.supplier) || (p.gstin&&p.gstin===res.supplier_gstin)));
  if(dup) issues.push(`bill ${res.invoice_no} from this supplier was already saved on ${dup.date}`);
  (res.unclear||[]).forEach(u=>issues.push('not clear on the photo: '+u));
  return {ok, issues, sumAmt, total, at:new Date().toISOString()};
}

/* turn a raw reading into stock-in rows */
function toItems(r, supplier){
  const al=aliasDoc(supplier).map;
  return (r.items||[]).map(it=>{
    const g=it.gst ?? defaultGst(it.name, CATS[it.category]?it.category:'other');
    let rate=num(it.rate); if(rate && it.rate_includes_gst===false && g) rate=r2(rate*(1+g/100));
    const nm=al[norm(it.raw_name||it.name)] || it.name || it.raw_name || '';
    const base={...blankItem(), raw_name:it.raw_name||it.name, name:nm, company:it.company||'', category:CATS[it.category]?it.category:'other', pack:it.pack||'', unit:it.unit||'bag', qty:num(it.qty)||1,
      batch:it.batch||'', expiry:it.expiry||'', buy_rate:rate||'', mrp:it.mrp||'', gst:g, hsn:it.hsn||defaultHsn(nm,it.category), amount:it.amount, confidence:it.confidence, _flags:it._flags||[]};
    const ex=S.products.find(p=>norm(p.name)===norm(nm)); if(ex){ base.mrp=base.mrp||ex.mrp||''; base.company=base.company||ex.company||''; base.content=ex.content||''; }
    const c=catMatch(nm); if(c){ if(!base.company && c.company!=='Generic') base.company=c.company; base.content=base.content||c.content; }
    return base;
  });
}

/* ---- on-device second reader: every number the AI read must also appear in the OCR text ---- */
function nearIn(hay, k, maxMiss){ for(let i=0;i+k.length<=hay.length;i++){ let m=0; for(let j=0;j<k.length && m<=maxMiss;j++) if(hay[i+j]!==k[j]) m++; if(m<=maxMiss) return true; } return false; }
function ocrVerify(r, text){
  const T=String(text).toUpperCase(); const nums=new Set(); const alnum=T.replace(/[^A-Z0-9]/g,'');
  (T.match(/\d[\d,]*(\.\d+)?/g)||[]).forEach(x=>{ const v=Number(x.replace(/,/g,'')); if(isFinite(v)) nums.add(r2(v)); });
  const want=[]; const add=(label,v)=>{ if(v===null||v===undefined||v==='') return; want.push([label,v]); };
  (r.items||[]).forEach((it,i)=>{ add(`qty of item ${i+1}`, it.qty); add(`rate of item ${i+1}`, it.rate); add(`amount of item ${i+1}`, it.amount); if(it.batch) add(`batch of item ${i+1}`, String(it.batch)); });
  add('bill total', r.bill_total); if(r.invoice_no) add('bill number', String(r.invoice_no)); if(r.supplier_gstin) add('GSTIN', String(r.supplier_gstin));
  let found=0; const missing=[];
  for(const [label,v] of want){
    let ok=false;
    if(typeof v==='number' || /^\d+(\.\d+)?$/.test(String(v))){ const n=r2(Number(v)); ok = nums.has(n) || nums.has(Math.round(n)) ; }
    else { const k=String(v).toUpperCase().replace(/[^A-Z0-9]/g,''); ok = k.length<3 || alnum.includes(k) || nearIn(alnum, k, Math.max(1, Math.floor(k.length/6))); }
    if(ok) found++; else missing.push(label);
  }
  return {found, total:want.length, missing};
}
/* ---- one bill photo (or several pages) → checked reading ---- */
async function readPurchase(blobs){
  const known=knownNames();
  const qr=await findQR(blobs[0]);
  let r=await ask(P_BILL2(known, {}), blobs);
  if(qr){ r.supplier_gstin=qr.gstin||r.supplier_gstin; r.invoice_no=qr.no||r.invoice_no; r.invoice_date=qr.date||r.invoice_date; if(qr.total) r.bill_total=qr.total; }
  const al=aliasDoc(r.supplier).map; if(Object.keys(al).length){ /* re-map names this supplier used before */ (r.items||[]).forEach(it=>{ const m=al[norm(it.raw_name||it.name)]; if(m) it.name=m; }); }
  let chk=checkBill(r, qr);
  const serious=chk.issues.filter(x=>!/already saved|billed to GSTIN|not clear/.test(x));
  if(serious.length){
    try{
      const r2_=await AI.json(P_RECHECK({...r, items:(r.items||[]).map(({_flags,...x})=>x)}, serious), {images:blobs, modelTier:'complex', cache:false});
      const v=(r2_ && typeof r2_.text==='string')?parseJSON(r2_.text):r2_;
      if(v && Array.isArray(v.items)){ if(qr){ v.supplier_gstin=qr.gstin||v.supplier_gstin; v.invoice_no=qr.no||v.invoice_no; v.invoice_date=qr.date||v.invoice_date; if(qr.total) v.bill_total=qr.total; }
        const c2=checkBill(v, qr); if(c2.issues.length<=chk.issues.length){ r=v; chk=c2; chk.ok.unshift('Checked twice: read again with the careful reader'); } }
    }catch(e){}
  }
  try{ if(window.KK && KK.ocr){ const o=await KK.ocr(blobs[0]); if(o && o.text && o.text.length>80){ const v=ocrVerify(r, o.text); if(v.total){ if(v.missing.length) chk.issues.push(`on-device reader could not find ${v.missing.slice(0,4).join(', ')} on the photo`); else chk.ok.push(`On-device reader confirmed ${v.found} of ${v.total} numbers`); } } } }catch(e){}
  return {r, qr, chk};
}
async function readSaleBill(blobs){
  const known=S.products.filter(p=>p.qty>0).map(p=>({id:p.id,name:p.name,pack:p.pack||'',mrp:p.mrp||0}));
  const farmers=S.parties.filter(p=>!isSupplier(p)).slice(0,200).map(p=>({name:p.name,village:p.village||''}));
  const r=await ask(P_SALEBILL(known, farmers), blobs);
  const sales=(r.sales||[]).map(s=>{
    const items=(s.items||[]).map(it=>{ let p=it.id&&S.products.find(x=>x.id===it.id); if(!p) p=bestBatch(it.name); const q=num(it.qty)||1, rate=num(it.rate)|| (p?num(p.mrp):0);
      const bad=num(it.rate)&&num(it.amount)&&Math.abs(q*num(it.rate)-num(it.amount))>Math.max(2,num(it.amount)*0.012);
      return {pid:p?p.id:null, name:p?p.name:it.name, qty:q, rate, amount:num(it.amount)||r2(q*rate), _flags:[...(p?[]:['nostock']), ...(bad?['math']:[])]}; });
    const sum=r2(items.reduce((a,i)=>a+i.amount,0)); const tot=num(s.total)||sum;
    const flags=[]; if(Math.abs(sum-tot)>Math.max(3,tot*0.006)) flags.push(`items add up to ${rs(sum)} but the slip says ${rs(tot)}`);
    items.forEach((i,k)=>{ if(i._flags.includes('nostock')) flags.push(`item ${k+1} "${i.name}" is not in stock`); if(i._flags.includes('math')) flags.push(`item ${k+1}: qty × rate ≠ amount`); });
    if(s.confidence==='low') flags.push('handwriting not fully clear');
    return {...s, items, total:tot, flags, done:false};
  });
  return {sales, unclear:r.unclear||[]};
}

    }

    const n=sc.kind==='sale'?patch.result.sales.length:patch.result.items.length;

    if(openAfter && !S.inbox && (S.view==='in'||S.view==='sell'||S.view==='scans')){ openScan(sc.id); say(sc.kind==='sale'?`${n} అమ్మకాలు చదివాను.`:(patch.checks.issues.length?`చదివాను. ${patch.checks.issues.length} చోట్ల సరి చూడండి.`:'చదివాను. లెక్కలు అన్నీ సరిపోయాయి. సేవ్ నొక్కండి.')); }
    else { toast(msg); renderSoft(); }

    const cur=S.scans.find(x=>x.id===sc.id)||sc; await put('scans', {...cur, status:'error', err:aiError(e)}); toast(aiError(e)); renderSoft();
